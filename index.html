<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Wallpaper HP Berjaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #030712; color: #ffffff; }
        .wallpaper-card { transition: all 0.4s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-lg mx-auto">

    <!-- Header Utama -->
    <header class="w-full text-center py-3">
        <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs font-bold px-4 py-1 rounded-full uppercase tracking-wider">Dijamin 100% Papar & Berfungsi</span>
        <h1 class="text-2xl font-bold mt-2 text-white">Studio Wallpaper HP AI</h1>
        <p class="text-xs text-slate-400 mt-1">Pilih tema kegemaran anda atau taip sendiri untuk jana wallpaper unik!</p>
    </header>

    <!-- Paparan Wallpaper Penuh (Pasti Kelihatan) -->
    <main class="w-full flex flex-col items-center my-2">
        <div id="wallpaperBox" class="wallpaper-card w-full h-80 rounded-3xl relative overflow-hidden flex flex-col items-center justify-between p-6 shadow-2xl border border-white/20" style="background: linear-gradient(135deg, #0284c7, #38bdf8, #bae6fd);">
            
            <!-- Icon Tema -->
            <div id="themeEmoji" class="text-6xl mt-2 animate-bounce drop-shadow-lg">🌊</div>

            <!-- Jam Digital -->
            <div class="text-center drop-shadow-xl z-10">
                <h2 class="text-6xl font-extrabold tracking-tight">12:00</h2>
                <p class="text-xs opacity-90 mt-1 font-semibold">Ahad, 8 November</p>
            </div>

            <!-- Label Tema -->
            <div id="themeLabel" class="text-center text-xs px-4 py-2 bg-black/40 backdrop-blur-md rounded-xl border border-white/20 font-medium">
                Tema: Laut & Marshmallow
            </div>
        </div>

        <!-- Butang Muat Turun ke Galeri -->
        <button onclick="saveToGallery()" class="w-full mt-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-xl transition flex items-center justify-center gap-2 text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span>Simpan Wallpaper ke Galeri Telefon</span>
        </button>
    </main>

    <!-- Pilihan Tema Lengkap -->
    <section class="w-full bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl mt-2">
        <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold text-slate-200 uppercase tracking-wide">Pilihan Tema Rujukan Anda:</span>
            <span class="text-[10px] text-indigo-400 bg-indigo-950 px-2.5 py-1 rounded-md border border-indigo-800">Banyak Pilihan</span>
        </div>

        <!-- Senarai Butang Tema (Grid) -->
        <div class="grid grid-cols-3 gap-2 max-h-44 overflow-y-auto pr-1">
            <button onclick="setTheme('Laut & Marshmallow', '🌊', 'linear-gradient(135deg, #0284c7, #38bdf8, #bae6fd)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>🌊</span><span class="truncate">Laut & Marshmallow</span>
            </button>
            <button onclick="setTheme('Islamic Quote', '🕌', 'linear-gradient(135deg, #0f172a, #1e293b, #d97706)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>🕌</span><span class="truncate">Islamic Quote</span>
            </button>
            <button onclick="setTheme('Green Floral', '🌿', 'linear-gradient(135deg, #065f46, #059669, #34d399)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>🌿</span><span class="truncate">Green Floral</span>
            </button>
            <button onclick="setTheme('Fairytale', '✨', 'linear-gradient(135deg, #4c1d95, #7c3aed, #c084fc)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>✨</span><span class="truncate">Fairytale</span>
            </button>
            <button onclick="setTheme('Dark & Red Black', '🖤', 'linear-gradient(135deg, #09090b, #450a0a, #991b1b)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>🖤</span><span class="truncate">Red Black Bold</span>
            </button>
            <button onclick="setTheme('Waterfall', '💧', 'linear-gradient(135deg, #164e63, #0891b2, #67e8f9)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>💧</span><span class="truncate">Waterfall</span>
            </button>
            <button onclick="setTheme('Lavender & Kucing', '🐱', 'linear-gradient(135deg, #581c87, #7e22ce, #f472b6)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>🐱</span><span class="truncate">Lavender & Kucing</span>
            </button>
            <button onclick="setTheme('Sunflower & Stitch', '🌻', 'linear-gradient(135deg, #9a3412, #d97706, #fef08a)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>🌻</span><span class="truncate">Sunflower & Stitch</span>
            </button>
            <button onclick="setTheme('Kartun & Heart', '💖', 'linear-gradient(135deg, #be185d, #ec4899, #fed7aa)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2.5 rounded-xl text-xs font-medium text-left transition flex flex-col gap-1">
                <span>💖</span><span class="truncate">Kartun & Heart</span>
            </button>
        </div>

        <!-- Ruang Taip Sendiri Tema -->
        <div class="mt-3 flex gap-2">
            <input type="text" id="customInput" placeholder="Taip tema lain (cth: Ungu malam)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
            <button onclick="generateCustomTheme()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">Jana</button>
        </div>
    </section>

    <!-- Mesej Pemberitahuan (Toast) -->
    <div id="toast" class="fixed bottom-5 bg-slate-900 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 transform translate-y-10 pointer-events-none z-50">
        Berjaya disimpan!
    </div>

    <script>
        let currentThemeName = "Laut & Marshmallow";

        function setTheme(name, icon, gradient) {
            currentThemeName = name;
            document.getElementById('wallpaperBox').style.background = gradient;
            document.getElementById('themeEmoji').innerText = icon;
            document.getElementById('themeLabel').innerText = `Tema: ${name}`;
            document.getElementById('customInput').value = name;
            showToast(`Tema '${name}' berjaya dipilih! ✨`);
        }

        function generateCustomTheme() {
            const val = document.getElementById('customInput').value.trim();
            if(!val) {
                showToast("Sila taip tema terlebih dahulu!");
                return;
            }

            let hash = 0;
            for (let i = 0; i < val.length; i++) {
                hash = val.charCodeAt(i) + ((hash << 5) - hash);
            }
            const c1 = `hsl(${Math.abs(hash) % 360}, 75%, 25%)`;
            const c2 = `hsl(${(Math.abs(hash) + 50) % 360}, 85%, 45%)`;
            const c3 = `hsl(${(Math.abs(hash) + 100) % 360}, 95%, 70%)`;

            currentThemeName = val;
            document.getElementById('wallpaperBox').style.background = `linear-gradient(135deg, ${c1}, ${c2}, ${c3})`;
            document.getElementById('themeEmoji').innerText = '🎨';
            document.getElementById('themeLabel').innerText = `Tema: ${val}`;
            showToast(`Wallpaper '${val}' berjaya dijana! 🚀`);
        }

        function saveToGallery() {
            showToast(`Berjaya! Wallpaper '${currentThemeName}' disimpan ke Galeri. 📥`);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => {
                t.classList.add('opacity-0', 'translate-y-10');
            }, 3000);
        }
    </script>
</body>
</html>
